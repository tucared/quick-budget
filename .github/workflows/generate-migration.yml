name: Generate Migration

# When a PR changes a declarative schema file (`supabase/schemas/**`), this
# workflow boots a local Postgres (via `supabase db start` — just the DB,
# not the full auth/storage/realtime stack), runs `supabase db diff` against
# the already-applied migration chain, and auto-commits the generated
# migration back to the PR branch — but only if the diff has real DDL. A
# comment-only or empty diff is treated as a no-op so this is safe to run on
# every PR.
#
# `budget_summary` is NOT declared in supabase/schemas/. The view body lives
# entirely in supabase/migrations/ (baseline plus future hand-authored
# migrations for body changes). Migra has too many bugs around views
# (supabase/cli#3973, #792): it doesn't read pg_class.reloptions, doesn't
# diff GRANT/REVOKE, emits a drop+recreate on every db diff regardless of
# whether anything changed, and silently strips both options and grants on
# the recreate. Every PR to schemas/** was getting a junk auto-commit that
# also dropped security_invoker and grants on commit.
#
# Defense: the `gen` step below strips any `budget_summary` view DDL migra
# emits from the auto-migration before evaluating REAL_LINES. For no-op
# emissions (view-only output), this empties the file and the workflow
# drops it. For side-effect cases (column adds + drop+recreate emitted by
# migra out of conservatism), this strips the drop+recreate and keeps just
# the column adds — Postgres allows ALTER TABLE ADD COLUMN without touching
# dependent views, so the recreate was unnecessary anyway, and skipping it
# means the view's options and grants are preserved.
#
# Real view body changes are hand-authored migrations. So is the pinning
# migration (supabase/migrations/*_pin_budget_summary_view_options_and_grants.sql)
# that owns the security_invoker option + grants for steady-state.
#
# The workflow also regenerates `src/lib/database.types.ts` on every run so
# the committed TypeScript types always reflect the current schema. If a
# developer forgets `npm run types:generate` locally, the bot commits the
# updated file alongside (or instead of) the migration.
#
# If the PR carries the `apply-to-dev` label, the final step pushes the
# resulting migration chain to the Dev Supabase project (via `supabase db
# push`), so an agent can dogfood the schema change without an extra MCP
# round-trip. Labeling fires the workflow even when no code changed.
#
# Why: lets agents (Claude Code on the web, etc.) iterate on schemas without
# needing local Docker for `supabase start`. The CLI-generated migration is
# guaranteed to match the declarative schema, so PRs ship without drift.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "supabase/schemas/**"
  workflow_dispatch:

# When a PR is opened already carrying `apply-to-dev`, GitHub fires `opened`
# and `labeled` near-simultaneously. Two concurrent workflow runs would each
# generate a migration and race to push to the PR branch. Serialize per-PR so
# newer events cancel older runs cleanly.
concurrency:
  group: generate-migration-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  generate:
    # Skip on fork PRs (GITHUB_TOKEN can't push back) and skip `labeled`
    # events for unrelated labels — only `apply-to-dev` should re-trigger.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.action != 'labeled' || github.event.label.name == 'apply-to-dev')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # supabase/setup-cli@v2 auto-detects the version from package-lock.json
      # (the `supabase` devDependency is the single source of truth — bump it
      # via `npm install supabase@<version> --save-dev` to upgrade).
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2

      - name: Start local Postgres
        run: supabase db start

      - name: Generate migration from schema diff
        id: gen
        run: |
          set -euo pipefail
          NAME="auto_$(date -u +%Y%m%d%H%M%S)"
          # `supabase db diff -f <name>` writes the diff to
          # supabase/migrations/<timestamp>_<name>.sql. If schemas already
          # match the migration chain, the file body is comment-only.
          #
          # --schema public restricts migra to the public schema. The realtime
          # broadcast layer (messages policy, trigger function, triggers,
          # publication membership) is hand-authored in supabase/migrations/
          # because migra cannot reliably express cross-schema dependencies
          # between public functions and realtime.messages policies (see
          # supabase/cli#3974, #4314). The trigger function lives in the
          # `private` schema so this default scope cannot see it either,
          # preventing accidental DROP statements on subsequent diffs. The
          # private schema's other contents (private.get_my_household_id) are
          # declared in schemas/02_tables.sql for self-documentation but are
          # also intentionally outside this diff scope — schema changes there
          # require a hand-authored migration too.
          supabase db diff -f "$NAME" --schema public
          FILE=$(ls -1t supabase/migrations/*_"$NAME".sql 2>/dev/null | head -1 || true)
          if [ -z "$FILE" ]; then
            echo "produced=false" >> "$GITHUB_OUTPUT"
            echo "no file produced"
            exit 0
          fi

          # Strip any budget_summary view DDL migra emitted. See the header
          # comment for the full rationale. Two patterns:
          #   1. `drop view if exists "public"."budget_summary";` — single line.
          #   2. `create or replace view "public"."budget_summary" as ...;` —
          #      multi-line, ends with `;` on its own (or trailing) line.
          # Both get deleted unconditionally. Other DDL (column adds, index
          # creates, etc.) in the same file is preserved.
          sed -i \
            -e '/^drop view if exists "public"\."budget_summary";[[:space:]]*$/d' \
            -e '/^create or replace view "public"\."budget_summary" as/,/;[[:space:]]*$/d' \
            "$FILE"

          # Count non-comment, non-blank lines after the strip. If nothing
          # else remains, the auto-migration was pure migra noise — drop it.
          REAL_LINES=$(grep -cvE '^\s*(--|$)' "$FILE" || true)
          if [ "${REAL_LINES:-0}" -eq 0 ]; then
            echo "Schemas already in sync (or only budget_summary noise); dropping $FILE"
            rm -f "$FILE"
            echo "produced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Generated migration with $REAL_LINES non-comment lines: $FILE"
          echo "produced=true" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Apply migration to local DB
        if: steps.gen.outputs.produced == 'true'
        run: supabase migration up

      # Combined output `has_changes` collapses the
      # `produced == 'true' || types_updated == 'true'` condition that every
      # downstream step previously repeated. Subsequent steps gate on this
      # single output.
      - name: Regenerate TypeScript types
        id: regen
        run: |
          set -euo pipefail
          supabase gen types typescript --local > src/lib/database.types.ts
          types_updated=false
          if ! git diff --quiet src/lib/database.types.ts; then
            types_updated=true
          fi
          echo "types_updated=$types_updated" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.gen.outputs.produced }}" = "true" ] || [ "$types_updated" = "true" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      # GitHub suppresses workflow re-triggers when an action pushes with the
      # default GITHUB_TOKEN, so checks.yml does not re-run on the bot's
      # commit. Verify the regenerated types/migrations against the codebase
      # here, before committing, so the bot can't push a broken state.
      - name: Set up Node.js (for verification)
        if: steps.regen.outputs.has_changes == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        if: steps.regen.outputs.has_changes == 'true'
        run: npm ci

      - name: Lint, typecheck, and test
        if: steps.regen.outputs.has_changes == 'true'
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Commit and push
        if: steps.regen.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/ src/lib/database.types.ts
          git diff --cached --quiet && exit 0
          git commit -m "Auto-generate migration and regenerate TypeScript types"
          git push

      - name: Comment on PR
        if: steps.regen.outputs.has_changes == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const items = [];
            if ('${{ steps.gen.outputs.produced }}' === 'true')
              items.push('migration: `${{ steps.gen.outputs.file }}`');
            if ('${{ steps.regen.outputs.types_updated }}' === 'true')
              items.push('TypeScript types: `src/lib/database.types.ts`');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Bot committed ${items.join(' + ')}.\n\nReview before merging — pull the bot's commit if you have a local checkout.`
            });

      # `db push` is idempotent (tracks applied versions in supabase_migrations)
      # so this safely no-ops if the migration chain already matches Dev.
      # Multiple labeled PRs open at once will share Dev — daily reset-dev.yml
      # at 05:00 UTC cleans up.
      - name: Push migration chain to Dev (label-gated)
        if: contains(github.event.pull_request.labels.*.name, 'apply-to-dev')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_DEV_PROJECT_REF }}"
          supabase db push --linked
