name: Generate Migration from Schema

# When a PR changes a declarative schema file (`supabase/schemas/**`), this
# workflow boots a local Supabase stack, runs `supabase db diff` against the
# already-applied migration chain, and auto-commits the generated migration
# back to the PR branch — but only if the diff has real DDL. A comment-only
# or empty diff is treated as a no-op so this is safe to run on every PR.
#
# Migrations that recreate `budget_summary` get an idempotent
# `ALTER VIEW public.budget_summary SET (security_invoker = true)` appended,
# working around a documented migra limitation (supabase/cli#3973, #792) that
# silently strips view options on every drop+create. Without this, the view
# would run with its owner role (postgres → BYPASSRLS) and leak every
# household's rows to authenticated callers. See the inline comment in the
# "Generate migration" step for details.
#
# The workflow also regenerates `src/lib/database.types.ts` on every run so
# the committed TypeScript types always reflect the current schema. If a
# developer forgets `npm run types:generate` locally, the bot commits the
# updated file alongside (or instead of) the migration.
#
# If the PR carries the `apply-to-dev` label, the final step pushes the
# resulting migration chain to the Dev Supabase project (via `supabase db
# push`), so an agent can dogfood the schema change without an extra MCP
# round-trip. Labeling fires the workflow even when no code changed.
#
# Why: lets agents (Claude Code on the web, etc.) iterate on schemas without
# needing local Docker for `supabase start`. The CLI-generated migration is
# guaranteed to match the declarative schema, so PRs ship without drift.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "supabase/schemas/**"
  workflow_dispatch:

# When a PR is opened already carrying `apply-to-dev`, GitHub fires `opened`
# and `labeled` near-simultaneously and both pass the job-level filter below.
# Two concurrent runs would each generate a migration and race to push to the
# PR branch. Serialize per-PR so newer events cancel older runs cleanly.
concurrency:
  group: generate-migration-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  generate:
    # Skip on fork PRs (GITHUB_TOKEN can't push back) and skip `labeled`
    # events for unrelated labels — only `apply-to-dev` should re-trigger.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.action != 'labeled' || github.event.label.name == 'apply-to-dev')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.98.2

      - name: Start local Supabase stack
        run: supabase start

      - name: Generate migration from schema diff
        id: gen
        run: |
          set -euo pipefail
          NAME="auto_$(date -u +%Y%m%d%H%M%S)"
          # `supabase db diff -f <name>` writes the diff to
          # supabase/migrations/<timestamp>_<name>.sql. If schemas already
          # match the migration chain, the file body is comment-only.
          #
          # --schema public restricts migra to the public schema. The realtime
          # broadcast layer (messages policy, trigger function, triggers,
          # publication membership) is hand-authored in supabase/migrations/
          # because migra cannot reliably express cross-schema dependencies
          # between public functions and realtime.messages policies (see
          # supabase/cli#3974, #4314). The trigger function lives in the
          # `private` schema so this default scope cannot see it either,
          # preventing accidental DROP statements on subsequent diffs. The
          # private schema's other contents (private.get_my_household_id) are
          # declared in schemas/02_tables.sql for self-documentation but are
          # also intentionally outside this diff scope — schema changes there
          # require a hand-authored migration too.
          supabase db diff -f "$NAME" --schema public
          FILE=$(ls -1t supabase/migrations/*_"$NAME".sql 2>/dev/null | head -1 || true)
          if [ -z "$FILE" ]; then
            echo "produced=false" >> "$GITHUB_OUTPUT"
            echo "no file produced"
            exit 0
          fi
          # Count non-comment, non-blank lines to decide if there's real DDL.
          REAL_LINES=$(grep -cvE '^\s*(--|$)' "$FILE" || true)
          if [ "${REAL_LINES:-0}" -eq 0 ]; then
            echo "Schemas already in sync with migrations; dropping comment-only $FILE"
            rm -f "$FILE"
            echo "produced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Migra cannot track view options like security_invoker
          # (supabase/cli#3973, #792): it strips them on every drop+create
          # and doesn't read schema-level ALTER VIEW SET declarations. The
          # supabase docs recommend hand-authored migrations for views with
          # this option; until budget_summary is migrated out of
          # supabase/schemas/, self-heal by appending an idempotent
          # ALTER VIEW SET whenever the diff recreates the view.
          if grep -q '^drop view if exists "public"\."budget_summary";' "$FILE"; then
            {
              echo ""
              echo "-- Auto-appended by generate-migration.yml: migra strips view"
              echo "-- options on every drop+create-or-replace. Re-apply"
              echo "-- security_invoker=true on budget_summary so authenticated"
              echo "-- callers don't bypass RLS via the view owner role."
              echo "ALTER VIEW public.budget_summary SET (security_invoker = true);"
            } >> "$FILE"
            echo "Appended ALTER VIEW SET (security_invoker = true) to $FILE"
          fi

          echo "Generated migration with $REAL_LINES non-comment lines: $FILE"
          echo "produced=true" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Apply migration to local DB
        if: steps.gen.outputs.produced == 'true'
        run: supabase migration up

      - name: Regenerate TypeScript types
        id: regen
        run: |
          set -euo pipefail
          supabase gen types typescript --local > src/lib/database.types.ts
          if git diff --quiet src/lib/database.types.ts; then
            echo "types_updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "types_updated=true" >> "$GITHUB_OUTPUT"
          fi

      # GitHub suppresses workflow re-triggers when an action pushes with the
      # default GITHUB_TOKEN, so test.yml does not re-run on the bot's commit.
      # Verify the regenerated types/migrations against the codebase here,
      # before committing, so the bot can't push a broken state. Gated on the
      # same condition as the commit step — no point installing Node when the
      # diff is a no-op.
      - name: Set up Node.js (for verification)
        if: steps.gen.outputs.produced == 'true' || steps.regen.outputs.types_updated == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        if: steps.gen.outputs.produced == 'true' || steps.regen.outputs.types_updated == 'true'
        run: npm ci

      - name: Lint, typecheck, and test
        if: steps.gen.outputs.produced == 'true' || steps.regen.outputs.types_updated == 'true'
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Commit and push
        if: steps.gen.outputs.produced == 'true' || steps.regen.outputs.types_updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/ src/lib/database.types.ts
          git diff --cached --quiet && exit 0
          git commit -m "Auto-generate migration and regenerate TypeScript types"
          git push

      - name: Comment on PR
        if: steps.gen.outputs.produced == 'true' || steps.regen.outputs.types_updated == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const items = [];
            if ('${{ steps.gen.outputs.produced }}' === 'true')
              items.push('migration: `${{ steps.gen.outputs.file }}`');
            if ('${{ steps.regen.outputs.types_updated }}' === 'true')
              items.push('TypeScript types: `src/lib/database.types.ts`');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Bot committed ${items.join(' + ')}.\n\nReview before merging — pull the bot's commit if you have a local checkout.`
            });

      # Only when the PR carries the `apply-to-dev` label. `db push` is
      # idempotent (tracks applied versions in supabase_migrations) so this
      # safely no-ops if the migration chain already matches Dev. Multiple
      # labeled PRs open at once will share Dev — daily reset-dev.yml at
      # 05:00 UTC cleans up.
      - name: Apply migrations to Dev (label-gated)
        if: contains(github.event.pull_request.labels.*.name, 'apply-to-dev')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_DEV_PROJECT_REF }}"
          supabase db push --linked
