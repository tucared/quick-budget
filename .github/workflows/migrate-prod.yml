name: Migrate Prod

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: read

# Two quick merges to main must not run `db push` against Prod concurrently;
# queue them instead.
concurrency:
  group: migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2

      - name: Push migrations to prod
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROD_PROJECT_REF }}"
          supabase db push

      # Detection, not prevention: this runs after the push, so a missing-RLS
      # table is briefly live on Prod before CI fails — it's an alarm that the
      # merge needs an immediate follow-up, not a gate that stops it.
      - name: Run security advisors (fails on missing RLS)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db advisors \
            --linked \
            --type security \
            --level error \
            --fail-on error
