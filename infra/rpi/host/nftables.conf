#!/usr/sbin/nft -f

# Only replace our own table: `flush ruleset` would also wipe tailscaled's rules.
table inet filter
delete table inet filter

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif lo accept
		meta l4proto { icmp, ipv6-icmp } accept

		# LAN: Pi-hole DNS + admin, DHCP renewals, mDNS, Tailscale direct connections, SSH as a backup
		iifname "wlan0" udp dport { 53, 68, 546, 5353, 41641 } accept
		iifname "wlan0" tcp dport { 53, 80 } accept
		iifname "wlan0" ip saddr 192.168.1.0/24 tcp dport 22 accept

		# Tailnet: SSH + mosh
		iifname "tailscale0" tcp dport 22 accept
		iifname "tailscale0" udp dport 60000-61000 accept
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
	}
	chain output {
		type filter hook output priority filter;
	}
}
